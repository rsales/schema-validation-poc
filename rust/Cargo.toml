[package]
name = "schema_validator"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49.2", default-features = false }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "validation"
harness = false